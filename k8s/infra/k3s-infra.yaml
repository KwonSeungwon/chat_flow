# ChatFlow K3s Infrastructure — Single-node, optimized
# Apply: kubectl apply -f k8s/infra/k3s-infra.yaml -n chatflow
---
# ======================== PostgreSQL 16 ========================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: chatflow
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: chatflow-postgresql-secret
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: chatflow-postgresql-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatflow-postgresql-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: chatflow
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
---
# ======================== Valkey 7.2 (Redis) ========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: chatflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:7.2-alpine
          ports:
            - containerPort: 6379
          command: ["sh", "-c", "valkey-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass $VALKEY_PASSWORD"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatflow-valkey-secret
                  key: VALKEY_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: chatflow
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
