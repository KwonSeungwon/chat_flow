# Docker Compose for Local Development Environment
version: '3.8'

services:
  valkey:
    image: valkey/valkey:7.2-alpine
    hostname: valkey
    container_name: valkey-local
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes --save 60 1 --loglevel notice
    volumes:
      - valkey_local_data:/data
    networks:
      - chatflow-local
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgresql:
    image: postgres:16-alpine
    hostname: postgresql
    container_name: postgresql-local
    environment:
      POSTGRES_DB: chatflow_local
      POSTGRES_USER: chatflow
      POSTGRES_PASSWORD: chatflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - chatflow-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatflow -d chatflow_local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.47.0
    hostname: prometheus
    container_name: prometheus-local
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_local_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - chatflow-local

  grafana:
    image: grafana/grafana:10.2.0
    hostname: grafana
    container_name: grafana-local
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_local_data:/var/lib/grafana
    networks:
      - chatflow-local

  zipkin:
    image: openzipkin/zipkin:3
    hostname: zipkin
    container_name: zipkin-local
    ports:
      - "9411:9411"
    networks:
      - chatflow-local
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  chatflow-local:
    driver: bridge

volumes:
  valkey_local_data:
  postgres_local_data:
  prometheus_local_data:
  grafana_local_data:
