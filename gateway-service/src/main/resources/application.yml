# 모든 프로필 공통. 네이버는 Spring 기본 제공자가 아니라서 엔드포인트를 직접 등록한다.
# client id/secret(registration)은 로그인 흐름을 붙일 때 환경변수로 넣는다. registration이 없으면
# OAuth2 클라이언트 자동 설정이 꺼져 있어 지금 동작은 바뀌지 않는다.
spring:
  security:
    oauth2:
      client:
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
