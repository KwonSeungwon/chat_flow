name: Deploy to K3s (manual)

# Pulls a service image from GHCR onto the K3s node and rolls out the
# matching Deployment. Manually triggered to keep deploy intent explicit
# — develop-build.yml only produces the image; this workflow ships it.
#
# The K3s node sits BEHIND Cloudflare Access (SSH has no public port; it is
# reached only via `cloudflared access ssh`). So the runner installs
# cloudflared and connects through it using a Cloudflare Access SERVICE TOKEN.
# The node then pulls the image from GHCR into containerd (anonymous pull —
# the packages are public; a read:packages token is used only if provided),
# and we `kubectl set image` to force a rollout against the pinned sha-* tag.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   K3S_HOST              — e.g. node.goosip.com
#   K3S_USER              — e.g. ksw
#   K3S_SSH_KEY           — private key (PEM/OpenSSH), no passphrase
#   CF_ACCESS_CLIENT_ID   — Cloudflare Access service token client id
#   CF_ACCESS_CLIENT_SECRET — Cloudflare Access service token client secret
# Optional:
#   K3S_GHCR_USERNAME / K3S_GHCR_TOKEN — only if the GHCR packages are made
#     private (read:packages). Left unset → anonymous pull.

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        type: choice
        options:
          - chat-service
          - gateway-service
          - ai-summary-service
          - search-service
          - frontend
        required: true
      tag:
        description: 'Image tag (e.g. sha-<full-sha> or develop-latest)'
        type: string
        required: true
        default: 'develop-latest'

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase repo paths — keep aligned with develop-build.yml
  IMAGE_PREFIX: ghcr.io/kwonseungwon/chatflow
  NAMESPACE: chatflow

jobs:
  rollout:
    runs-on: ubuntu-latest
    environment: k3s-prod
    steps:
      - name: Validate inputs
        env:
          SERVICE: ${{ github.event.inputs.service }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          for v in "$SERVICE" "$TAG"; do
            if ! printf '%s' "$v" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "Invalid input: $v" >&2
              exit 1
            fi
          done

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: '2026.9.3'
          CLOUDFLARED_SHA256: '77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2'
        run: |
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o /tmp/cloudflared
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH (via Cloudflare Access)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.K3S_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host ${{ secrets.K3S_HOST }}
            User ${{ secrets.K3S_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

      - name: Pull image into K3s containerd
        env:
          SERVICE: ${{ github.event.inputs.service }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}/${SERVICE}:${TAG}"
          if [ -n "${{ secrets.K3S_GHCR_TOKEN }}" ]; then
            ssh "${{ secrets.K3S_HOST }}" \
              "sudo k3s ctr image pull --user '${{ secrets.K3S_GHCR_USERNAME }}:${{ secrets.K3S_GHCR_TOKEN }}' '${IMAGE}'"
          else
            ssh "${{ secrets.K3S_HOST }}" "sudo k3s ctr image pull '${IMAGE}'"
          fi
          echo "Pulled ${IMAGE} into k3s containerd"

      - name: Rollout Deployment
        env:
          SERVICE: ${{ github.event.inputs.service }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          DEPLOY="chatflow-${SERVICE}"
          IMAGE="${{ env.IMAGE_PREFIX }}/${SERVICE}:${TAG}"
          # container name inside the pod matches the service name (Helm convention)
          CONTAINER="${SERVICE}"
          ssh "${{ secrets.K3S_HOST }}" \
            "sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
              -n ${{ env.NAMESPACE }} set image deployment/${DEPLOY} \
              ${CONTAINER}=${IMAGE}"
          ssh "${{ secrets.K3S_HOST }}" \
            "sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
              -n ${{ env.NAMESPACE }} rollout status deployment/${DEPLOY} --timeout=6m"

      - name: Verify pod
        env:
          SERVICE: ${{ github.event.inputs.service }}
        run: |
          ssh "${{ secrets.K3S_HOST }}" \
            "sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
              -n ${{ env.NAMESPACE }} get pods -l app.kubernetes.io/name=${SERVICE} \
              -o wide"
