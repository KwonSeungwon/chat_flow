<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 좀비 프로세스: 낡은 후드티의 초록 좀비, PID 꼬리표, 뻗은 팔 -->
  <ellipse cx="100" cy="186" rx="70" ry="10" fill="#000000" opacity="0.18"/>
  <!-- legs -->
  <rect x="72" y="146" width="22" height="38" rx="8" fill="#4a4f66"/>
  <rect x="108" y="150" width="22" height="34" rx="8" fill="#3e4358"/>
  <path d="M108 176 L114 170 L120 178 L126 170 L130 178" stroke="#7ab06a" stroke-width="4" fill="none"/>
  <!-- outstretched arms -->
  <rect x="122" y="88" width="60" height="20" rx="10" fill="#6b7a8f"/>
  <circle cx="182" cy="98" r="11" fill="#9ccc88"/>
  <path d="M188 90 L194 86 M190 98 L198 98 M188 106 L194 110" stroke="#9ccc88" stroke-width="4" stroke-linecap="round"/>
  <rect x="18" y="96" width="60" height="20" rx="10" fill="#5d6b80"/>
  <circle cx="18" cy="106" r="11" fill="#8cbc78"/>
  <!-- ragged hoodie body -->
  <path d="M60 156 L62 96 C62 84 80 78 100 78 C120 78 138 84 138 96 L140 156 L128 148 L118 158 L106 148 L94 158 L82 148 L72 158 Z" fill="#6b7a8f"/>
  <path d="M86 112 L114 112 L114 132 L86 132 Z" fill="#5a687d"/>
  <!-- PID tag -->
  <line x1="116" y1="100" x2="126" y2="122" stroke="#c9b48a" stroke-width="2"/>
  <rect x="118" y="120" width="22" height="14" rx="3" fill="#f3e6c8" transform="rotate(12 129 127)"/>
  <rect x="122" y="125" width="12" height="2.5" fill="#8a7c6c" transform="rotate(12 129 127)"/>
  <rect x="122" y="129" width="8" height="2.5" fill="#8a7c6c" transform="rotate(12 129 127)"/>
  <!-- head -->
  <ellipse cx="100" cy="56" rx="30" ry="32" fill="#9ccc88"/>
  <path d="M70 52 C70 20 130 18 130 50 C122 36 96 34 84 42 C80 46 74 48 70 52 Z" fill="#3e4358"/>
  <circle cx="88" cy="58" r="8" fill="#f4f1e8"/><circle cx="112" cy="60" r="6" fill="#f4f1e8"/>
  <circle cx="88" cy="60" r="3" fill="#24304d"/><circle cx="113" cy="61" r="2" fill="#24304d"/>
  <path d="M86 76 L92 72 L98 77 L104 72 L110 76" stroke="#3a5a30" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <path d="M120 44 L126 52 L122 56" stroke="#6a8f5a" stroke-width="2" fill="none"/>
  <!-- stitch -->
  <path d="M76 68 L84 70 M78 64 L78 72 M82 66 L82 73" stroke="#6a8f5a" stroke-width="1.8"/>
  <!-- ghostly terminal cursor -->
  <rect x="146" y="44" width="12" height="18" fill="#5bd18a" opacity="0.8"/>
  <polyline points="128,46 136,53 128,60" stroke="#5bd18a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
