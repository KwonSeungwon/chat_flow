  <!-- wide workshop door -->
  <path d="M50,186 L78,200 L78,180 L50,166 Z" fill="#9b6a3f"/>
  <line x1="64" y1="173" x2="64" y2="193" stroke="#7d5330" stroke-width="1.5"/>
  <!-- wrench sign -->
  <rect x="38" y="140" width="5" height="20" rx="2" fill="#5f6b85" transform="rotate(35 40 150)"/>
  <circle cx="35" cy="142" r="5" fill="#5f6b85"/>
  <circle cx="35" cy="142" r="2" fill="#fff2dc"/>
  <!-- crate -->
  <polygon points="150,196 162,202 162,212 150,206" fill="#d6a46a"/>
  <polygon points="162,202 174,196 174,206 162,212" fill="#bf8c55"/>
  <polygon points="150,196 162,190 174,196 162,202" fill="#e6b97f"/>
