  <g transform="translate(126 166)">
    <rect x="-3.5" y="-19" width="7" height="38" rx="1.5" fill="#7b8aa8"/>
    <rect x="-3.5" y="-19" width="7" height="38" rx="1.5" fill="#7b8aa8" transform="rotate(45)"/>
    <rect x="-3.5" y="-19" width="7" height="38" rx="1.5" fill="#7b8aa8" transform="rotate(90)"/>
    <rect x="-3.5" y="-19" width="7" height="38" rx="1.5" fill="#7b8aa8" transform="rotate(135)"/>
    <circle r="14" fill="#8e9cb8"/>
    <circle r="5.5" fill="#f0dcc0"/>
  </g>
  <!-- small gear -->
  <g transform="translate(146 146)">
    <rect x="-2.5" y="-11" width="5" height="22" rx="1" fill="#a5b1c8"/>
    <rect x="-2.5" y="-11" width="5" height="22" rx="1" fill="#a5b1c8" transform="rotate(60)"/>
    <rect x="-2.5" y="-11" width="5" height="22" rx="1" fill="#a5b1c8" transform="rotate(120)"/>
    <circle r="8" fill="#b4bfd3"/>
    <circle r="3" fill="#f0dcc0"/>
