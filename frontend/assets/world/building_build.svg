<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 224" width="192" height="224">
  <!-- 빌드 공방: 노란 지붕, 벽면 톱니바퀴, 렌치 -->
  <polygon points="96,136 184,180 96,224 8,180" fill="#d5dbe7"/>
  <polygon points="96,132 184,176 96,220 8,176" fill="#eef1f6"/>
  <polygon points="104,150 172,184 104,218 36,184" fill="#3b4a6b" opacity="0.12"/>
  <polygon points="32,178 96,210 96,158 32,126" fill="#fff2dc"/>
  <polygon points="96,210 160,178 160,126 96,158" fill="#f0dcc0"/>
  <polygon points="26,126 96,162 96,64" fill="#ffd34d"/>
  <polygon points="96,162 166,126 96,64" fill="#e8b830"/>
  <!-- roof vent -->
  <rect x="60" y="88" width="12" height="16" rx="2" fill="#ffe58a"/>
