# Static server for the Flutter Web build. In K8s this file is replaced by the
# Helm ConfigMap (helm/chatflow/charts/frontend/templates/configmap.yaml), which
# adds the /api and /ws proxies. TLS is terminated by Cloudflare, never here.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 55m;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # SPA routing — index.html no-cache
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Android APK download
        location = /chatflow-app.apk {
            add_header Content-Disposition 'attachment; filename="chatflow-app.apk"';
            add_header Content-Type application/vnd.android.package-archive;
            add_header Cache-Control "no-cache";
        }

        location = /version.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # Flutter assets and every JS file keep stable filenames across builds
        location /assets/ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location ~* \.js$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # CanvasKit wasm is versioned by engine hash
        location ~* ^/canvaskit/.*\.wasm$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
