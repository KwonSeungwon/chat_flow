# Static server for the Flutter Web build. In K8s this file is replaced by the
# Helm ConfigMap (helm/gossiplog/charts/frontend/templates/configmap.yaml), which
# adds the /api and /ws proxies. TLS is terminated by Cloudflare, never here.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # nginx:alpine mime.types has no ttf entry (falls back to octet-stream, never gzipped)
    types { font/ttf ttf; }
    default_type application/octet-stream;

    # Behind the Cloudflare tunnel $remote_addr is always the node; log the visitor IP.
    log_format visitor '$http_cf_connecting_ip $remote_addr [$time_local] "$request" '
                       '$status $body_bytes_sent rt=$request_time "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log visitor;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 55m;

        # Visitors who open http:// get a non-secure context: no WebCrypto, so
        # flutter_secure_storage cannot save the login token. Cloudflare sends the
        # visitor scheme in CF-Visitor; in-cluster requests carry no such header.
        if ($http_cf_visitor ~* '"scheme":"http"') {
            return 301 https://$host$request_uri;
        }

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json font/ttf;
        gzip_proxied any;

        # SPA routing — index.html no-cache
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Android APK download
        location = /gossiplog-app.apk {
            add_header Content-Disposition 'attachment; filename="gossiplog-app.apk"';
            add_header Content-Type application/vnd.android.package-archive;
            add_header Cache-Control "no-cache";
        }

        location = /version.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # Flutter assets and every JS file keep stable filenames across builds
        location /assets/ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location ~* \.js$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # CanvasKit wasm filenames are not hashed (canvaskit.wasm, skwasm.wasm) —
        # revalidate via ETag so a Flutter upgrade is picked up
        location ~* \.wasm$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
