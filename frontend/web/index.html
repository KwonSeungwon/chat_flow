<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Gossiplog - 친구랑 채팅하다가 같이 위키 던전 깨러 가요">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gossiplog">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Gossiplog</title>
  <link rel="manifest" href="manifest.json">
  <!-- Preload icon font so glyphs are ready when widgets first render. -->
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin="anonymous">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #EEF4FF;
      overflow: hidden;
      height: 100vh;
    }

    #gossiplog-loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #EEF4FF, #FDF3E7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 9999;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #gossiplog-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Ambient glow blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
    }
    .blob-1 {
      width: 320px; height: 320px;
      background: #6C8CFF;
      top: -60px; left: -80px;
      animation: drift1 8s ease-in-out infinite;
    }
    .blob-2 {
      width: 240px; height: 240px;
      background: #FFC48A;
      bottom: -40px; right: -60px;
      animation: drift2 10s ease-in-out infinite;
    }

    /* Logo */
    .logo-wrap {
      position: relative;
      width: 80px; height: 80px;
    }
    .logo-ring {
      width: 80px; height: 80px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 1px rgba(108,140,255,0.25),
        0 0 40px rgba(108,140,255,0.25),
        0 8px 32px rgba(59,74,107,0.18);
      animation: logo-pulse 2.4s ease-in-out infinite;
      overflow: hidden;
    }
    .logo-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    /* Spinning orbit ring */
    .orbit {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: rgba(108,140,255,0.6);
      border-right-color: rgba(160,123,255,0.4);
      animation: orbit-spin 2s linear infinite;
    }

    /* App name */
    .app-name {
      color: #24304D;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .app-sub {
      color: #6B7896;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      letter-spacing: 0.2px;
      margin-top: -20px;
    }

    /* Progress bar */
    .progress-wrap {
      width: 140px;
      height: 2px;
      background: #E3E8F2;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #6C8CFF, #A07BFF);
      animation: progress-sweep 1.8s ease-in-out infinite;
    }

    @keyframes logo-pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(108,140,255,0.25), 0 0 30px rgba(108,140,255,0.2), 0 8px 32px rgba(59,74,107,0.18); }
      50% { box-shadow: 0 0 0 1px rgba(108,140,255,0.4), 0 0 60px rgba(108,140,255,0.35), 0 8px 40px rgba(59,74,107,0.24); }
    }
    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes progress-sweep {
      0%   { width: 0%;   margin-left: 0%; }
      50%  { width: 70%;  margin-left: 15%; }
      100% { width: 0%;   margin-left: 100%; }
    }
    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 20px) scale(1.1); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-20px, -30px) scale(1.05); }
    }

    /* 저장된 테마가 다크일 때(아래 head 스크립트가 html.dark를 붙인다) */
    html.dark body { background: #161A26; }
    html.dark #gossiplog-loader { background: #161A26; }
    html.dark .app-name { color: #F0F2F5; }
    html.dark .app-sub { color: #9AA3B8; }
    html.dark .progress-wrap { background: #2A2F45; }
  </style>
  <script>
    // 첫 페인트 전에 동기 실행. shared_preferences_web은 값을 JSON 인코딩해
    // localStorage['flutter.<key>']에 저장하므로 문자열 "dark"는 "\"dark\""로 들어 있다.
    try {
      var raw = localStorage.getItem('flutter.gossiplog-theme-mode');
      if (raw !== null && JSON.parse(raw) === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="gossiplog-loader">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="logo-wrap">
      <div class="logo-ring">
        <img src="icons/Icon-512.png" alt="Gossiplog">
      </div>
      <div class="orbit"></div>
    </div>

    <div class="app-name">Gossiplog</div>
    <div class="app-sub">채팅하고 같이 던전 깨는 곳</div>

    <div class="progress-wrap">
      <div class="progress-fill"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('gossiplog-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () { loader.remove(); }, 460);
      }
    });
  </script>
</body>
</html>
