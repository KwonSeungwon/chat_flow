name: chatflow
description: ChatFlow - Real-time Chat Application
publish_to: 'none'
version: 3.0.4+6

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  dio: ^5.4.3
  # WebSocket / STOMP
  stomp_dart_client: ^2.0.0
  # State Management
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.7
  # Secure Storage
  flutter_secure_storage: ^9.2.2
  # Date/Time
  intl: ^0.19.0
  # Environment
  flutter_dotenv: ^5.1.0
  # Fonts
  google_fonts: ^6.2.1
  # Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
  firebase_performance: ^0.10.0+5
  # Local notifications (foreground FCM display)
  flutter_local_notifications: ^18.0.0
  # File picker (Web + Android)
  file_picker: ^8.0.0
  # URL launcher (file download)
  url_launcher: ^6.3.0
  # Preferences storage (non-sensitive, e.g. theme)
  shared_preferences: ^2.3.0
  uuid: ^4.5.3
  # Emoji picker for full emoji selection
  emoji_picker_flutter: ^4.2.0
  # Game engine (위키 던전 월드)
  flame: ^1.38.2
  flame_svg: ^2.0.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # FilePicker.platform 을 테스트에서 갈아끼우려면 MockPlatformInterfaceMixin 이 필요하다.
  plugin_platform_interface: ^2.1.8
  flame_test: ^2.3.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/app_icon.png
    - assets/world/
