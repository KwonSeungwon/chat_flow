dependencies {
    implementation project(':common')
    
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Low-level Elasticsearch Java client (formerly pulled transitively by
    // spring-boot-starter-data-elasticsearch, removed with the Spring-Data stack).
    // Versions managed by Spring Boot 3.2 BOM (resolves to 8.10.4).
    // ElasticsearchClient/RestClient beans live in ElasticsearchConfig.
    implementation 'co.elastic.clients:elasticsearch-java'
    implementation 'org.elasticsearch.client:elasticsearch-rest-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'

    // RSS Feed 파싱
    implementation 'com.rometools:rome:2.1.0'
    
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:elasticsearch'
    testImplementation 'org.testcontainers:kafka'
}