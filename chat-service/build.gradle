dependencies {
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'com.google.firebase:firebase-admin:9.4.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'org.apache.tika:tika-core:2.9.2'
    implementation 'org.flywaydb:flyway-core'
    // LinkPreview: 검증한 IP로만 연결(DnsResolver 고정). 새 명시 의존성이며 버전은 Spring Boot BOM 관리(5.2.x). firebase-admin이 끌어오는 httpclient 4.5.x와는 패키지가 다르다
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MapStruct — compile-time DTO mapping generator. Must come AFTER Lombok
    // in annotationProcessor list so MapStruct sees Lombok-generated
    // getters/setters when introspecting types.
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    // lombok-mapstruct-binding lets MapStruct properly resolve types
    // generated by Lombok's @Builder pattern.
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql'
}