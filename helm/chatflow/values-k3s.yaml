# K3s 단일노드 배포: 최소 리소스, GHCR 이미지
# 이미지는 develop-build.yml이 GHCR로 push (ghcr.io/kwonseungwon/chatflow/<svc>:sha-<full>).
# K3s 노드 containerd가 익명 pull 가능(패키지 public). 배포마다 tag를 최신 sha로 올린다.
# (직전엔 docker.io/chatflow:latest pullPolicy:Never 레거시 로컬 import 방식이었음.)
global:
  namespace: chatflow
  image:
    registry: ghcr.io
    repository: kwonseungwon/chatflow
    pullPolicy: IfNotPresent
    tag: "sha-8a079278dd8d796ca3f762108973c3981d7afa65"
  imagePullSecrets: []

  externalSecrets:
    postgresql:
      secretName: chatflow-postgresql-secret
    kafka:
      secretName: chatflow-kafka-secret
    valkey:
      secretName: chatflow-valkey-secret
    elasticsearch:
      secretName: chatflow-elasticsearch-secret
    gemini:
      secretName: chatflow-gemini-secret
    jwt:
      secretName: chatflow-jwt-secret

  springProfile: prod,langchain4j

ingress:
  enabled: false

gateway-service:
  enabled: true
  replicaCount: 1
  image:
    name: gateway-service
  service:
    port: 8000
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  hpa:
    enabled: false

chat-service:
  enabled: true
  replicaCount: 1
  image:
    name: chat-service
  service:
    port: 8080
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: 500m
      memory: 640Mi
  hpa:
    enabled: false
  fileStorage:
    size: 5Gi
    storageClass: local-path

ai-summary-service:
  enabled: true
  replicaCount: 1
  image:
    name: ai-summary-service
  service:
    port: 8081
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi
  hpa:
    enabled: false

search-service:
  enabled: true
  replicaCount: 1
  image:
    name: search-service
  service:
    port: 8082
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  hpa:
    enabled: false

frontend:
  enabled: true
  replicaCount: 1
  image:
    name: frontend
  service:
    port: 80
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  hpa:
    enabled: false
  gatewayServicePort: 8000
