apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chat-service.fullname" . }}
  labels:
    {{- include "chat-service.labels" . | nindent 4 }}
data:
  JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -Duser.timezone=UTC"
  GAME_ADMIN_USER_IDS: {{ .Values.gameAdminUserIds | default "" | quote }}
