global:
  namespace: gossiplog
  image:
    registry: ghcr.io
    repository: OWNER/gossiplog  # GitHub org/user — CI에서 자동 치환
    pullPolicy: IfNotPresent
    tag: "latest"
  imagePullSecrets:
    - name: ghcr-pull-secret

  # 외부 인프라 Secret 참조 (클러스터에 미리 생성 필요)
  externalSecrets:
    postgresql:
      secretName: gossiplog-postgresql-secret
    valkey:
      secretName: gossiplog-valkey-secret
    jwt:
      secretName: gossiplog-jwt-secret

  springProfile: prod

# --- 서비스별 기본값 ---
gateway-service:
  enabled: true
  replicaCount: 2
  image:
    name: gateway-service
  service:
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

chat-service:
  enabled: true
  replicaCount: 2
  image:
    name: chat-service
  service:
    port: 8080
  fileStorage:
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

frontend:
  enabled: true
  replicaCount: 2
  image:
    name: frontend
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  gatewayServicePort: 8000
